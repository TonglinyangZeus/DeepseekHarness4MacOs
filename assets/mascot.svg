<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#1c3b60"/>
      <stop offset="55%" stop-color="#132641"/>
      <stop offset="100%" stop-color="#0a1524"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3794d6"/>
      <stop offset="100%" stop-color="#1a5380"/>
